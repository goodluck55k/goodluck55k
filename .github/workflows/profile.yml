name: Update profile artwork

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'assets/processed/**'
      - 'assets/fonts/**'
      - '.github/workflows/profile.yml'

permissions:
  contents: read

concurrency:
  group: profile-artwork
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned image dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify cached build and logic
        run: |
          python scripts/build.py
          python -m unittest discover -s tests -v
      - name: Refresh public statistics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/collect.py
      - name: Build offline from validated caches
        run: python scripts/build.py
      - name: Commit only changed generated resources
        run: |
          git add -- README.md assets/static assets/stats assets/data
          if git diff --cached --quiet; then
            echo 'No public data or generated artwork changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update public profile artwork'
          git push
